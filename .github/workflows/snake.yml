name: Generar serpiente de contribuciones

on:
  schedule:
    - cron: "0 */12 * * *" # cada 12 horas
  workflow_dispatch:
  push:
    branches: [main]
    paths-ignore:
      - "profile/**"

permissions:
  contents: write

concurrency:
  group: serpiente
  cancel-in-progress: true

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      # Un SVG por año (claro y oscuro) en dist/ y las pestañas por año en el README.
      - name: Generar serpientes por año
        run: node .github/scripts/serpiente.mjs "${{ github.repository_owner }}" dist README.md

      - name: Publicar en la rama output
        uses: crazy-max/ghaction-github-pages@v4
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # Solo hace commit si cambió algún total o empezó un año nuevo.
      - name: Guardar README
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add README.md
          git commit -m "chore: actualizar serpientes por año" || exit 0
          git pull --rebase origin main
          git push
