name: Actualizar tarjetas del README

on:
  schedule:
    - cron: "0 5 * * *" # todos los días a las 00:00 de Ecuador
  workflow_dispatch:     # permite ejecutarlo a mano desde la pestaña Actions
  push:                  # y cada vez que subes cambios a main
    branches: [main]
    paths-ignore:
      - "profile/**"     # no se vuelve a lanzar por sus propias tarjetas

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v6

      - name: Tarjeta de estadísticas
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: stats
          options: username=${{ github.repository_owner }}&show_icons=true&include_all_commits=true&bg_color=13222c&title_color=dcec6b&icon_color=dcec6b&text_color=eef1f2&border_color=284352&border_radius=10&locale=es
          path: profile/stats.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Tarjeta de lenguajes
        uses: stats-organization/github-readme-stats-action@v2
        with:
          card: top-langs
          options: username=${{ github.repository_owner }}&layout=compact&langs_count=8&bg_color=13222c&title_color=dcec6b&icon_color=dcec6b&text_color=eef1f2&border_color=284352&border_radius=10&locale=es
          path: profile/top-langs.svg
          token: ${{ secrets.GITHUB_TOKEN }}

      - name: Guardar tarjetas
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/*.svg
          git commit -m "chore: actualizar tarjetas del README" || exit 0
          git pull --rebase origin main
          git push